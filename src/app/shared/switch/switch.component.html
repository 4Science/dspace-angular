<div class="btn-group" (click)="onToggle()" role="switch" [attr.aria-checked]="isOn">
  <div class="switch-container" [ngClass]="backgroundClass">
    <div>
      <div class="switch-opt" [class.bg-white]="isOn">
        <i *ngIf="checkedOption?.icon" [class]="checkedOption.icon + ' ' + (isOn ? 'text-' + checkedOption.iconColor : '')"></i>
      </div>
    </div>
    <div>
      <div class="switch-opt" [class.bg-white]="!isOn">
        <i *ngIf="uncheckedOption?.icon" [class]="uncheckedOption.icon + ' ' + (!isOn ? 'text-' + uncheckedOption.iconColor : '')"></i>
      </div>
    </div>
  </div>
  <span *ngIf="activeOption?.label"
        [class]="'text-' + (activeOption?.labelColor || '')"
        class="visibility-label ml-2 font-weight-bold">
    {{ activeOption.label | translate }}
  </span>
</div>
